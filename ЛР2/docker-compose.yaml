version: '3.9'

services:
  db:
    image: postgres:16
    container_name: menu_stolovoy_db
    hostname: menu_stolovoy_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-menu_stolovoy}
      POSTGRES_USER: ${POSTGRES_USER:-menu_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?в .env должен быть указан POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"  
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-menu_user} -d ${POSTGRES_DB:-menu_stolovoy}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    container_name: menu_stolovoy_app
    hostname: menu_stolovoy_app
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-menu_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-menu_stolovoy}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-prod}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
