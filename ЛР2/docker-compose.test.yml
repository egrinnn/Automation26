services:
  db:
    image: postgres:16
    container_name: menu_test_db
    hostname: menu_test_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-menu_stolovoy}
      POSTGRES_USER: ${POSTGRES_USER:-menu_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?в .env.test должен быть указан POSTGRES_PASSWORD}
    volumes:
      - test_db_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-menu_user} -d ${POSTGRES_DB:-menu_stolovoy}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    image: denizkaderli/menu-stolovoy:${APP_TAG:-dev}
    container_name: menu_test_app
    hostname: menu_test_app
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-menu_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-menu_stolovoy}
      SECRET_KEY: ${SECRET_KEY:-test-secret-change-me}
      FLASK_ENV: production
    ports:
      - "5002:5000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  test_db_data:
